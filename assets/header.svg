<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 240" width="100%" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="240" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Abstract Mathematical Waves (SciML / EEG Waves Representation) -->
  <path d="M 0,160 Q 200,80 400,160 T 800,160 T 1200,140 L 1200,240 L 0,240 Z" fill="url(#waveGrad)" />
  <path d="M 0,190 Q 250,130 500,180 T 1000,170 T 1200,190" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="4 6" />
  <path d="M 0,175 Q 300,110 600,170 T 1200,160" fill="none" stroke="#818cf8" stroke-width="2" stroke-opacity="0.5" />

  <!-- Top Badge -->
  <g transform="translate(60, 48)">
    <rect width="210" height="26" rx="13" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <circle cx="16" cy="13" r="4" fill="#38bdf8" />
    <text x="28" y="17" fill="#38bdf8" font-family="'JetBrains Mono', 'Segoe UI', monospace" font-size="11" font-weight="600" letter-spacing="1">RESEARCHER @ HCMUT</text>
  </g>

  <!-- Main Name Title -->
  <text x="60" y="122" fill="#f8fafc" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
    Dinh Hoang Duy Khanh
  </text>

  <!-- Subtitle with Gradient Accent -->
  <text x="60" y="156" fill="url(#cyanGrad)" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600" letter-spacing="0.5">
    Scientific Machine Learning · PINNs · Privacy-Preserving BCI · Computational Physics
  </text>

  <!-- Right Side Visual / Math Matrix Emblem -->
  <g transform="translate(1020, 60)" opacity="0.6">
    <circle cx="60" cy="60" r="50" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" />
    <circle cx="60" cy="60" r="30" fill="none" stroke="#818cf8" stroke-width="1.5" />
    <circle cx="60" cy="60" r="10" fill="#38bdf8" />
    <line x1="60" y1="0" x2="60" y2="120" stroke="#334155" stroke-width="1.5" />
    <line x1="0" y1="60" x2="120" y2="60" stroke="#334155" stroke-width="1.5" />
  </g>
</svg>
